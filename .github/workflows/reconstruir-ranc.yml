name: Reconstruir CSV RANC desde partes verificadas

on:
  push:
    branches:
      - data/historico-ranc-35007
    paths:
      - 'data/ranc_partes/**'
      - '.github/workflows/reconstruir-ranc.yml'

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir CSV, validar integridad y retirar temporales
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          from collections import Counter

          root = Path("data")
          parts_dir = root / "ranc_partes"
          parts = sorted(parts_dir.glob("ranc_*.part"))
          assert len(parts) == 6, f"Se esperaban 6 partes y hay {len(parts)}"
          payload = b"".join(part.read_bytes() for part in parts)
          expected_sha256 = "fd8fa0e80a956f1fbf1af4846c5d1fd4a26b9d08969669a6eb9e90ce0e115186"
          assert hashlib.sha256(payload).hexdigest() == expected_sha256, "El CSV no coincide con el archivo recibido"
          output = root / "Ordenes de Servicio RANC.csv"
          output.write_bytes(payload)
          with output.open(encoding="utf-8-sig", newline="") as fh:
              reader = csv.DictReader(fh)
              totals = Counter()
              for row in reader:
                  totals["registros"] += 1
                  totals[row["Fuente_datos"]] += 1
              assert totals["registros"] == 35007, f"Conteo incorrecto: {totals}"
              assert totals["RANC"] == 35007, f"Procedencia inesperada: {totals}"
          for part in parts:
              part.unlink()
          parts_dir.rmdir()
          # Script temporal, no es requerido después de publicar el CSV definitivo.
          Path(".github/workflows/reconstruir-ranc.yml").unlink()
          print(f"Integridad verificada: {totals['registros']} registros RANC; {len(payload)} bytes.")
          PY
      - name: Publicar archivo consolidado en la misma rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: publicar histórico RANC validado de 35.007 órdenes"
          git push origin HEAD:refs/heads/data/historico-ranc-35007
