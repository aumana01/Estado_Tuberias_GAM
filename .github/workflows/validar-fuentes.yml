name: Validar integración de órdenes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validar-fuentes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias de pruebas
        run: python -m pip install "pandas>=2.0" "geopandas>=1.0" "pyogrio>=0.8" "folium>=0.15"
      - name: Verificar sintaxis de módulos y aplicación
        run: python -m py_compile app.py modules/order_sources.py modules/data_loader.py modules/mapping.py scripts/integrar_fugas_ranc.py
      - name: Ejecutar pruebas de procedencia
        run: python -m unittest discover -s tests -v
